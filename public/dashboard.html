<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Team — vanKonijnenburg</title>
<link rel="stylesheet" href="/app.css">
</head>
<body>
  <div class="app-shell">
    <nav class="sidebar">
      <div class="brand" style="padding:8px 14px 20px"><span class="dot"></span> vanKonijnenburg</div>
      <a href="/documents.html">Documentanalyse</a>
      <a href="/excel.html" id="navExcel">Excel-templates</a>
      <a href="/billing.html" id="navBilling" style="display:none">Abonnement</a>
      <a href="/dashboard.html" class="active">Team</a>
      <div style="flex:1"></div>
      <a href="#" id="logoutLink">Log out</a>
    </nav>
    <script>
      // Runs synchronously while the page parses, so the sidebar is correct at first paint. The
      // authoritative role still comes from /api/me a moment later, but waiting for that meant
      // the Abonnement tab popped into the nav after load (CEO) or flashed past before being
      // hidden (employee) -- on every single tab switch. This is a RENDERING hint only: the
      // server refuses billing actions from non-CEOs no matter what is stored here, so a stale
      // or tampered value changes what you see, never what you can do.
      try {
        if (localStorage.getItem('vk_role') === 'ceo') {
          document.getElementById('navBilling').style.display = '';
        }
      } catch (e) { /* private mode / storage disabled: fall back to the post-fetch reveal */ }
    </script>

    <main class="main">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:18px">
        <h1 style="font-size:22px">Team</h1>
        <button class="btn" id="addEmpBtn" style="display:none">+ Add employee</button>
      </div>
      <div class="card" id="empList"></div>
    </main>
  </div>

<script>
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

async function api(path, opts = {}) {
  const r = await fetch(path, { headers: { 'Content-Type': 'application/json' }, ...opts });
  const data = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(data.error || 'Something went wrong.');
  return data;
}

async function loadEmployees() {
  const { employees } = await api('/api/employees');
  document.getElementById('empList').innerHTML = employees.map((e) => `
    <div class="emp-row">
      <div>
        <div style="font-weight:500">${esc(e.name || e.email)} ${e.role === 'ceo' ? '<span class="badge plan" style="margin-left:6px">CEO</span>' : ''}</div>
        <div class="muted" style="font-size:13px">${esc(e.email)}</div>
      </div>
      ${e.role === 'employee' && window.__isCeo ? `<button class="btn danger" data-id="${e.id}" style="padding:6px 12px;font-size:13px">Remove</button>` : ''}
    </div>`).join('');
  document.getElementById('empList').querySelectorAll('button[data-id]').forEach((btn) => btn.addEventListener('click', async () => {
    if (!confirm('Remove this employee?')) return;
    await api(`/api/employees/${btn.dataset.id}`, { method: 'DELETE' });
    loadEmployees();
  }));
}
document.getElementById('addEmpBtn').addEventListener('click', async () => {
  const email = prompt('Email address of the new employee:');
  if (!email) return;
  const name = prompt('Name:') || '';
  const password = prompt('Temporary password (min. 8 characters):');
  if (!password) return;
  try {
    await api('/api/employees', { method: 'POST', body: JSON.stringify({ email, name, password }) });
    loadEmployees();
  } catch (err) {
    alert(err.message);
  }
});

document.getElementById('logoutLink').addEventListener('click', async (e) => {
  e.preventDefault();
  try { localStorage.removeItem('vk_role'); } catch (e) {}
  await api('/api/logout', { method: 'POST' });
  window.location.href = '/login.html';
});

(async () => {
  let me;
  try { me = await api('/api/me'); } catch { window.location.href = '/login.html'; return; }
  const isCeo = me.user.role === 'ceo';
  // Cache the role for the synchronous nav hint at the top of the page, so the next navigation
  // paints the correct sidebar immediately instead of correcting it after this fetch returns.
  try { localStorage.setItem('vk_role', me.user.role); } catch (e) {}
  if (isCeo) document.getElementById('addEmpBtn').style.display = 'inline-flex';
  // Billing is a CEO concern: the subscribe/cancel endpoints already refuse anyone else. The
  // link starts hidden and is revealed here, so employees never see it flash past on load.
  if (isCeo) document.getElementById('navBilling').style.display = '';
  window.__isCeo = isCeo;
  if (me.company.track === 'general') document.getElementById('navExcel').remove();
  loadEmployees();
})();
</script>
</body>
</html>
