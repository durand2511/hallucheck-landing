<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Registreren — vanKonijnenburg</title>
<link rel="stylesheet" href="/app.css">
<script src="https://js.stripe.com/v3/"></script>
</head>
<body>
  <header class="topbar wrap">
    <div class="nav">
      <a class="brand" href="/"><span class="dot"></span> vanKonijnenburg</a>
      <a class="navlink" href="/login.html">Al een account? Inloggen</a>
    </div>
  </header>

  <div class="auth-shell">
    <div id="step1" class="card">
      <h2>Account aanmaken</h2>
      <p class="muted" style="margin-top:0">Voor accountants- en audit-kantoren die documenten willen laten controleren op feitelijke onderbouwing.</p>

      <label for="companyName">Bedrijfsnaam</label>
      <input id="companyName" placeholder="Jansen Accountants B.V.">

      <label>Pakket</label>
      <div class="plan-grid" id="planGrid"></div>

      <label for="name">Jouw naam</label>
      <input id="name" placeholder="Voornaam Achternaam">
      <label for="email">E-mailadres (dit wordt je CEO/eigenaar-account)</label>
      <input id="email" type="email" placeholder="jij@kantoor.nl">
      <label for="password">Wachtwoord (min. 8 tekens)</label>
      <input id="password" type="password" placeholder="••••••••">

      <button class="btn" id="toStep2" style="width:100%;margin-top:22px">Doorgaan naar betaling →</button>
      <div id="msg1" class="msg"></div>
    </div>

    <div id="step2" class="card" style="display:none">
      <h2>Betaalmethode</h2>
      <p class="muted" style="margin-top:0" id="planSummary"></p>
      <div id="payment-element" style="margin:18px 0"></div>
      <button class="btn" id="pay" style="width:100%">Bevestigen en starten</button>
      <button class="btn secondary" id="back" style="width:100%;margin-top:10px">← Terug</button>
      <div id="msg2" class="msg"></div>
    </div>
  </div>

<script>
const PLANS = {
  starter: { label: "Starter", price: 295, desc: "25 complexe + 50 kleine docs/mnd — 1-5 fte" },
  professional: { label: "Professional", price: 695, desc: "80 complexe + 150 kleine docs/mnd — 6-25 fte" },
  enterprise: { label: "Enterprise", price: 1495, desc: "200 complexe + onbeperkt kleine docs/mnd — grote kantoren" },
};
let selectedPlan = "professional";
const grid = document.getElementById('planGrid');
Object.entries(PLANS).forEach(([key, p]) => {
  const el = document.createElement('div');
  el.className = 'plan-card' + (key === selectedPlan ? ' selected' : '');
  el.dataset.plan = key;
  el.innerHTML = `<div class="plabel">${p.label}</div><div class="pprice">€${p.price}<small>/mnd</small></div><div class="pdesc">${p.desc}</div>`;
  el.addEventListener('click', () => {
    selectedPlan = key;
    [...grid.children].forEach((c) => c.classList.toggle('selected', c.dataset.plan === key));
  });
  grid.appendChild(el);
});

let stripe, elements, companyId;

document.getElementById('toStep2').addEventListener('click', async () => {
  const msg = document.getElementById('msg1');
  msg.className = 'msg'; msg.textContent = '';
  const body = {
    companyName: document.getElementById('companyName').value.trim(),
    plan: selectedPlan,
    name: document.getElementById('name').value.trim(),
    email: document.getElementById('email').value.trim(),
    password: document.getElementById('password').value,
  };
  if (!body.companyName || !body.email || !body.password) { msg.textContent = 'Vul alle verplichte velden in.'; msg.className = 'msg err'; return; }

  const btn = document.getElementById('toStep2');
  btn.disabled = true;
  try {
    const r = await fetch('/api/register', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
    const data = await r.json();
    if (!r.ok) throw new Error(data.error || 'Registratie mislukt.');
    companyId = data.company.id;

    const si = await fetch('/api/billing/setup-intent', { method: 'POST' }).then((r) => r.json());
    stripe = Stripe(si.publishableKey);
    elements = stripe.elements({ clientSecret: si.clientSecret, appearance: { theme: 'night', variables: { colorPrimary: '#7c9bff', colorBackground: '#111319', colorText: '#eef0f5', borderRadius: '10px' } } });
    elements.create('payment').mount('#payment-element');

    document.getElementById('planSummary').textContent = `${PLANS[selectedPlan].label} — €${PLANS[selectedPlan].price}/maand`;
    document.getElementById('step1').style.display = 'none';
    document.getElementById('step2').style.display = 'block';
  } catch (err) {
    msg.textContent = err.message; msg.className = 'msg err';
  } finally {
    btn.disabled = false;
  }
});

document.getElementById('back').addEventListener('click', () => {
  document.getElementById('step2').style.display = 'none';
  document.getElementById('step1').style.display = 'block';
});

document.getElementById('pay').addEventListener('click', async () => {
  const msg = document.getElementById('msg2');
  msg.className = 'msg'; msg.textContent = '';
  const btn = document.getElementById('pay');
  btn.disabled = true;
  try {
    const { error, setupIntent } = await stripe.confirmSetup({ elements, redirect: 'if_required' });
    if (error) throw new Error(error.message);
    const r = await fetch('/api/billing/subscribe', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ paymentMethodId: setupIntent.payment_method }),
    });
    const data = await r.json();
    if (!r.ok) throw new Error(data.error || 'Abonnement starten mislukt.');
    window.location.href = '/dashboard.html';
  } catch (err) {
    msg.textContent = err.message; msg.className = 'msg err';
  } finally {
    btn.disabled = false;
  }
});
</script>
</body>
</html>
