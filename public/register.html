<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Register — vanKonijnenburg</title>
<link rel="stylesheet" href="/app.css">
</head>
<body>
  <header class="topbar wrap">
    <div class="nav">
      <a class="brand" href="/"><span class="dot"></span> vanKonijnenburg</a>
      <a class="navlink" href="/login.html">Already have an account? Log in</a>
    </div>
  </header>

  <div class="auth-shell">
    <div class="card">
      <h2>Create your account</h2>
      <p class="muted" style="margin-top:0">Free to use — no credit card required.</p>

      <label for="companyName">Company name</label>
      <input id="companyName" placeholder="Acme Financial B.V.">
      <label for="name">Your name</label>
      <input id="name" placeholder="First Last">
      <label for="email">Email address (this becomes your CEO/owner account)</label>
      <input id="email" type="email" placeholder="you@company.com">
      <label for="password">Password (min. 8 characters)</label>
      <input id="password" type="password" placeholder="••••••••">

      <button class="btn" id="createBtn" style="width:100%;margin-top:22px">Create account →</button>
      <div id="msg" class="msg"></div>
    </div>
  </div>

<script>
document.getElementById('createBtn').addEventListener('click', async () => {
  const msg = document.getElementById('msg');
  msg.className = 'msg'; msg.textContent = '';
  const body = {
    companyName: document.getElementById('companyName').value.trim(),
    name: document.getElementById('name').value.trim(),
    email: document.getElementById('email').value.trim(),
    password: document.getElementById('password').value,
  };
  if (!body.companyName || !body.email || !body.password) { msg.textContent = 'Please fill in all required fields.'; msg.className = 'msg err'; return; }

  const btn = document.getElementById('createBtn');
  btn.disabled = true;
  try {
    const r = await fetch('/api/register', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
    const data = await r.json();
    if (!r.ok) throw new Error(data.error || 'Registration failed.');
    window.location.href = '/dashboard.html';
  } catch (err) {
    msg.textContent = err.message; msg.className = 'msg err';
  } finally {
    btn.disabled = false;
  }
});
document.getElementById('password').addEventListener('keydown', (e) => { if (e.key === 'Enter') document.getElementById('createBtn').click(); });
</script>
</body>
</html>
